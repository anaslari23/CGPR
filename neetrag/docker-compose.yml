# docker compose up -d ollama
# docker compose exec ollama ollama pull nomic-embed-text && docker compose exec ollama ollama pull qwen2.5:7b-instruct
# docker compose run --rm app python neetrag.py index
# docker compose run --rm app            (interactive ask)   |   ... python eval.py
services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    # NVIDIA GPU (needs nvidia-container-toolkit). Remove this block for CPU-only.
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  app:
    build: .
    stdin_open: true
    tty: true
    environment:
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b-instruct}
    volumes: [./index:/app/index, ./logs:/app/logs]
    depends_on: [ollama]
volumes:
  ollama:
