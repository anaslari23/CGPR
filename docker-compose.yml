# CPU works out of the box; add the GPU override on a machine with an NVIDIA GPU + nvidia-container-toolkit.
#   docker compose up -d ollama                       (CPU)   or: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama   (NVIDIA GPU)
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose exec ollama ollama pull qwen2.5:3b            # CPU / small GPU; use qwen2.5:7b-instruct on a 16 GB GPU
#   CHAT_MODEL=qwen2.5:3b docker compose run --rm app python neetrag.py index
#   CHAT_MODEL=qwen2.5:3b docker compose run --rm app python neetrag.py ask "..."     |   ... python eval.py
services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
  app:
    build: .
    stdin_open: true
    tty: true
    environment:
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b-instruct}
    volumes: [./index:/app/index, ./logs:/app/logs]
    depends_on: [ollama]
volumes:
  ollama:
